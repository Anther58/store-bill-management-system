<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>用户注册</title>

    <link rel="stylesheet" href="register.css">
</head>

<body>

<div class="login-box">

    <div style="text-align:center;">
        <img
                src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
                width="90">
    </div>

    <h1>创建账号</h1>

    <p style="text-align:center;color:white;margin-top:-15px;margin-bottom:25px;">
        Create Your Account
    </p>

    <input
            id="username"
            placeholder="请输入用户名">

    <input
            id="password"
            type="password"
            placeholder="请输入密码">

    <button onclick="register()">
        注册账号
    </button>

    <button
            onclick="location.href='login.html'"
            style="background:#67C23A;">
        返回登录
    </button>

</div>

<script src="user.js"></script>

</body>
</html>
