# 设置后端端口
server.port=8080
# 解决前后端跨域（后续前端网页访问必备）
spring.web.cors.allowed-origins=*
# 数据库连接
spring.datasource.url=jdbc:mysql://localhost:3306/bill_system?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai

spring.datasource.username=root

spring.datasource.password=123456

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# MyBatis配置

mybatis.mapper-locations=classpath:mapper/*.xml

mybatis.type-aliases-package=com.example.bill.entity

mybatis.configuration.map-underscore-to-camel-case=true

# Session
server.servlet.session.timeout=30m

# 允许跨站携带 Session Cookie
server.servlet.session.cookie.same-site=lax

# 本地开发必须关闭 Secure
server.servlet.session.cookie.secure=false